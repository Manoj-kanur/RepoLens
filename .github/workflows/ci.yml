# ──────────────────────────────────────────────────────────────────────────────
# RepoLens – Continuous Integration
#
# Triggers
# --------
# • pull_request  → any PR targeting  `develop` or `main`
# • push          → direct pushes to protected branches:
#                     develop · main · integration/** · release/**
# • workflow_dispatch → manual run from the GitHub Actions UI
#
# Jobs
# ----
# lint   – Ruff format-check + lint (fast gate, fails fast)
# test   – pytest (skipped gracefully when no test files exist)
# ──────────────────────────────────────────────────────────────────────────────

name: RepoLens CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main
      - "integration/**"
      - "release/**"

  workflow_dispatch:

# Allow the workflow to post status comments on PRs
permissions:
  contents: read
  pull-requests: write

# Cancel any in-progress run for the same branch/PR when a new commit arrives
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Shared defaults ───────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.11"

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Lint & Format ────────────────────────────────────────────────────────
  lint:
    name: "Ruff · Format & Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff – format check
        run: ruff format --check .

      - name: Ruff – lint check
        run: ruff check .

  # ── 2. Tests ─────────────────────────────────────────────────────────────────
  test:
    name: "pytest"
    runs-on: ubuntu-latest
    needs: lint                     # only run tests once linting passes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true
          fi

      - name: Detect test files
        id: detect
        run: |
          if find . -path './.git' -prune -o -name 'test_*.py' -print -o -name '*_test.py' -print | grep -q '.py'; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::No test files found – pytest step will be skipped."
          fi

      - name: Run pytest
        if: steps.detect.outputs.has_tests == 'true'
        run: pytest --tb=short -q

      - name: No tests found (skipped)
        if: steps.detect.outputs.has_tests == 'false'
        run: echo "Test suite not yet present. Skipping pytest."

  # ── 3. PR Summary Comment ────────────────────────────────────────────────────
  pr-comment:
    name: "Post CI summary to PR"
    runs-on: ubuntu-latest
    # Only run on pull-request events; not on direct pushes
    if: github.event_name == 'pull_request'
    needs: [lint, test]
    # Run even when lint/test fail so we can report the failure
    # (use `always()` on the step, not the job, to keep the job green on success)

    steps:
      - name: Determine overall result
        id: result
        # needs context is available even when jobs are skipped/failed
        run: |
          LINT="${{ needs.lint.result }}"
          TEST="${{ needs.test.result }}"
          if [ "$LINT" = "success" ] && [ "$TEST" = "success" ]; then
            echo "status=✅ All checks passed" >> "$GITHUB_OUTPUT"
            echo "emoji=🟢" >> "$GITHUB_OUTPUT"
          else
            echo "status=❌ One or more checks failed" >> "$GITHUB_OUTPUT"
            echo "emoji=🔴" >> "$GITHUB_OUTPUT"
          fi

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const header = '<!-- repolens-ci-summary -->';
            const lint   = '${{ needs.lint.result }}';
            const test   = '${{ needs.test.result }}';
            const status = '${{ steps.result.outputs.status }}';
            const emoji  = '${{ steps.result.outputs.emoji }}';

            const lintIcon = lint  === 'success' ? '✅' : lint  === 'skipped' ? '⏭️' : '❌';
            const testIcon = test  === 'success' ? '✅' : test  === 'skipped' ? '⏭️' : '❌';

            const body = [
              header,
              `## ${emoji} RepoLens CI Report`,
              '',
              `**${status}**`,
              '',
              '| Job | Result |',
              '|-----|--------|',
              `| 🎨 Ruff Format & Lint | ${lintIcon} \`${lint}\` |`,
              `| 🧪 pytest             | ${testIcon} \`${test}\` |`,
              '',
              `> Run triggered by **@${{ github.actor }}** · commit \`${{ github.sha }}\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(header));

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
